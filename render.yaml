# OmniMind AI — Render Blueprint Infrastructure-as-Code Configuration
services:
  # ── 1. FastAPI Core Engine Web Service ────────────────────────────────────
  - type: web
    name: omnimind-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run_server.py 8000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: omnimind-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: omnimind-redis
          property: connectionString
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true

  # ── 2. Celery Asynchronous Agent Worker Pool ──────────────────────────────
  - type: worker
    name: omnimind-celery-worker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run_worker.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: omnimind-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: omnimind-redis
          property: connectionString
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "false"

  # ── 3. Managed Redis Instance ─────────────────────────────────────────────
  - type: redis
    name: omnimind-redis
    ipAllowList: []

# ── 4. Managed PostgreSQL Database ───────────────────────────────────────────
databases:
  - name: omnimind-db
    databaseName: omnimind_db
    user: omnimind_user
