# OmniMind AI — Render Blueprint Infrastructure-as-Code Configuration (Free Tier Compatible)
services:
  # ── 1. FastAPI Core Engine & Embedded Worker Web Service ─────────────────
  - type: web
    name: omnimind-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn omnimind.backend.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: "."
      - key: DATABASE_URL
        fromDatabase:
          name: omnimind-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: omnimind-redis
          property: connectionString
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true

  # ── 2. Managed Redis Instance ─────────────────────────────────────────────
  - type: redis
    name: omnimind-redis
    plan: free
    ipAllowList: []

# ── 3. Managed PostgreSQL Database ───────────────────────────────────────────
databases:
  - name: omnimind-db
    databaseName: omnimind_db
    user: omnimind_user
    plan: free
