version: '3.8'

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: omnimind-postgres
    restart: always
    environment:
      POSTGRES_DB: omnimind_db
      POSTGRES_USER: omnimind
      POSTGRES_PASSWORD: omnimind_prod_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnimind -d omnimind_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis Event Bus & Celery Broker ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: omnimind-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend Core Service ─────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnimind-backend
    restart: always
    command: python run_server.py 8000
    environment:
      DATABASE_URL: postgresql+asyncpg://omnimind:omnimind_prod_password@postgres:5432/omnimind_db
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
      USE_S3_STORAGE: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./chroma_db:/app/chroma_db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Asynchronous Agent Worker Pool ─────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnimind-worker
    restart: always
    command: python run_worker.py
    environment:
      DATABASE_URL: postgresql+asyncpg://omnimind:omnimind_prod_password@postgres:5432/omnimind_db
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
    volumes:
      - ./uploads:/app/uploads
      - ./chroma_db:/app/chroma_db
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  # ── Next.js Visual Studio Canvas Frontend ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omnimind-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      NEXT_PUBLIC_WS_URL: ws://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
